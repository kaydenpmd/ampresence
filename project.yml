name: AMPresence

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  AMPresence:
    type: application
    platform: iOS
    sources:
      - path: AMPresence

    info:
      path: AMPresence/Info.plist
      properties:
        CFBundleDisplayName: AM Presence
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppleMusicUsageDescription: >-
          Reads what you're currently playing so it can be shown on Discord.
        # Required for the silent-audio keepalive in KeepAlive.swift.
        UIBackgroundModes:
          - audio

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ampresence
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        # This is the Swift *language mode*, not a compiler version.
        # Valid values are 4.0 / 4.2 / 5.0 / 6.0 — "5.9" is rejected.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
